# 통합 테스트용. 개발용 compose와 포트가 겹치지 않게 5xxxx 포트를 쓴다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "56379:6379"

  object-storage:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "58333:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    tmpfs:
      - /data

  create-buckets:
    image: amazon/aws-cli:2.38.6
    depends_on:
      - object-storage
    environment:
      AWS_ACCESS_KEY_ID: drive
      AWS_SECRET_ACCESS_KEY: drive-secret
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://object-storage:8333
    volumes:
      - ./docker/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]